apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: idea-validator
spec:
  stripPrefix:
    prefixes: [/api]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main
  namespace: idea-validator
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: idea-validator-strip-api@kubernetescrd
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gateway
            port: { number: 8000 }
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui
            port: { number: 80 }
