apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: idea-validator }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: idea-validator }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
      - name: postgres
        image: postgres:16.8-bookworm
        env:
        - { name: POSTGRES_USER, value: app }
        - { name: POSTGRES_DB, value: ideas }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD }
        ports: [{ containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "app"] }
          periodSeconds: 5
        livenessProbe:
          exec: { command: ["pg_isready", "-U", "app"] }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: idea-validator }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: idea-validator }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
      - name: redis
        image: redis:7.4.2-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports: [{ containerPort: 6379 }]
        readinessProbe:
          exec: { command: ["redis-cli", "ping"] }
          periodSeconds: 5
        livenessProbe:
          exec: { command: ["redis-cli", "ping"] }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
        volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: qdrant, namespace: idea-validator }
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: qdrant, namespace: idea-validator }
spec:
  serviceName: qdrant
  replicas: 1
  selector: { matchLabels: { app: qdrant } }
  template:
    metadata: { labels: { app: qdrant } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.4
        ports: [{ containerPort: 6333 }]
        readinessProbe:
          httpGet: { path: /healthz, port: 6333 }
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /healthz, port: 6333 }
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
        volumeMounts: [{ name: data, mountPath: /qdrant/storage }]
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ReadWriteOnce]
      resources: { requests: { storage: 2Gi } }
