apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  namespace: idea-validator
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: profile } }
  template:
    metadata: { labels: { app: profile } }
    spec:
      securityContext: { runAsNonRoot: true }
      initContainers:
      - name: migrate
        image: k3d-idea-registry:5001/profile:0000000
        command: ["alembic","upgrade","head"]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD }
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
      containers:
      - name: profile
        image: k3d-idea-registry:5001/profile:0000000
        imagePullPolicy: Always
        envFrom:
        - configMapRef: { name: platform-config }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD }
        ports: [{ containerPort: 8000 }]
        readinessProbe:
          httpGet: { path: /ready, port: 8000 }
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: 25m, memory: 64Mi }
          limits: { cpu: 250m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: profile
  namespace: idea-validator
spec:
  selector: { app: profile }
  ports: [{ port: 8000, targetPort: 8000 }]
