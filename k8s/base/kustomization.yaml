apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idea-validator
resources:
- namespace.yaml
- services.yaml
- stateful.yaml
- ingress.yaml
- networkpolicy.yaml
configMapGenerator:
- name: platform-config
  literals:
  - ORCHESTRATOR_URL=http://orchestrator:8000
  - VERDICT_URL=http://verdict:8000
  - API_BASE=/api
generatorOptions:
  disableNameSuffixHash: true
