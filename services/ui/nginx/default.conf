server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /health { add_header Content-Type text/plain; return 200 'ok'; }
    location = /ready { add_header Content-Type text/plain; return 200 'ready'; }
    location = /metrics { add_header Content-Type text/plain; return 200 'phase2_ui_up 1'; }
    location = /config.js { alias /tmp/config.js; add_header Cache-Control no-store; }
    location / { try_files $uri $uri/ /index.html; }
}
